# Vendored dependencies are excluded globally — they are upstream code
# that we do not lint, scan for secrets, or reformat.
exclude: ^go/vendor/

repos:
  # --- Secrets & credentials ---
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: \.lock$|package-lock\.json$

  # --- Go: vet + golangci-lint ---
  - repo: local
    hooks:
      - id: go-vet
        name: go vet
        language: system
        entry: bash -c 'cd go && export PATH=/usr/lib/golang/bin:$PATH GOROOT=/usr/lib/golang && go vet ./...'
        pass_filenames: false
        files: \.go$

      - id: golangci-lint
        name: golangci-lint (snabba linters)
        language: system
        entry: bash -c 'cd go && PATH=/usr/lib/golang/bin:$PATH GOROOT=/usr/lib/golang golangci-lint run --enable-only=govet,ineffassign,staticcheck ./internal/... ./cmd/server/... ./cmd/replay-server/... ./cmd/agent/... ./cmd/loadgen/...'
        pass_filenames: false
        files: \.go$

      - id: go-test
        name: go test
        language: system
        entry: bash -c 'cd go && export PATH=/usr/lib/golang/bin:$PATH GOROOT=/usr/lib/golang && go test -count=1 ./...'
        pass_filenames: false
        files: \.go$

  # --- Frontend: vitest (replay-server UI) ---
  - repo: local
    hooks:
      - id: ui-test
        name: npm test (replay-server UI)
        language: system
        entry: bash -c 'cd go/cmd/replay-server/ui && npm run test:run'
        pass_filenames: false
        files: ^go/cmd/replay-server/ui/.*\.(ts|tsx|js|jsx)$

  # --- C plugin: cppcheck + flawfinder ---
  - repo: local
    hooks:
      - id: cppcheck
        name: cppcheck (C plugin)
        language: system
        entry: cppcheck --enable=warning --suppress=missingIncludeSystem --error-exitcode=1
        files: plugin/.*\.c$
        pass_filenames: true

      - id: flawfinder
        name: flawfinder (C plugin, nivå 3+)
        language: system
        entry: flawfinder --minlevel=3 --error-level=3
        files: plugin/.*\.c$
        pass_filenames: true

      # AddressSanitizer + UBSan run of the plugin unit tests. Catches
      # out-of-bounds / use-after-free / UB in plugin.c and the test harness
      # that cppcheck and flawfinder miss (both are static-only). Uses clang
      # because this repo's build hosts ship compiler-rt but not gcc's
      # libasan/libubsan.
      - id: plugin-asan
        name: C plugin ASan/UBSan test
        language: system
        entry: >
          bash -c 'set -e; d=$(mktemp -d); trap "rm -rf $d" EXIT;
          cd plugin && clang -O1 -g -Iinclude -D_GNU_SOURCE
          -fsanitize=address,undefined -fno-omit-frame-pointer
          test_plugin.c -o "$d/test_plugin.asan" -lpthread &&
          UBSAN_OPTIONS=halt_on_error=1 "$d/test_plugin.asan"'
        files: ^plugin/.*\.(c|h)$
        pass_filenames: false

  # --- Semgrep (C + Go SAST) ---
  # Pattern-based SAST that cppcheck/flawfinder/go vet miss (taint tracking,
  # injection, unsafe patterns). Rules are VENDORED under .semgrep/rules/ so the
  # scan is fully offline and never uploads code — refresh them with:
  #   for p in c golang gosec; do curl -sfL https://semgrep.dev/c/p/$p \
  #     -o .semgrep/rules/$p.yml; done
  # Suppress a confirmed false positive with `// nosemgrep -- <reason>` on the
  # line above the finding. Needs `pip install --user semgrep`.
  - repo: local
    hooks:
      - id: semgrep
        name: semgrep (C + Go SAST)
        language: system
        # pass_filenames:false + one invocation — pre-commit otherwise fans the
        # file list out into concurrent chunks that race on ~/.semgrep and exit 2.
        entry: semgrep scan --config .semgrep/rules/ --error --quiet
          --metrics=off --disable-version-check
          --exclude='go/vendor' --exclude='*_test.go' plugin/ go/
        files: \.(c|h|go)$
        exclude: ^go/vendor/
        pass_filenames: false

  # --- npm audit (replay-server UI) ---
  # Fast GHSA-backed path for JS dependency alerts. Trivy's own vuln DB
  # curation for npm lags the GitHub Advisory Database by days-to-weeks, so
  # this catches fresh advisories (e.g. GHSA-73wf-gq98-2v4g) before Trivy does.
  - repo: local
    hooks:
      - id: npm-audit-ui
        name: npm audit (replay-server UI)
        language: system
        entry: bash -c 'cd go/cmd/replay-server/ui && npm audit --audit-level=high'
        pass_filenames: false
        files: ^go/cmd/replay-server/ui/package(-lock)?\.json$

  # --- Trivy (beroenden + IaC) ---
  # --include-dev-deps: build-time devDependencies still run in CI and on dev
  # machines; a crash / prototype-pollution in the build chain is a real
  # supply-chain risk, and Trivy suppresses npm dev deps without this flag.
  - repo: local
    hooks:
      - id: trivy
        name: Trivy filesystem scan
        language: system
        entry: trivy fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --include-dev-deps --skip-dirs go/vendor/github.com/testcontainers/testcontainers-go .
        pass_filenames: false
        files: (go\.mod|go\.sum|package(-lock)?\.json|Dockerfile|\.yaml|\.yml)$

  # --- Generella hooks (whitespace, syntax, mm) ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
        exclude: ^charts/.*/templates/
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
